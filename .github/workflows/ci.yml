name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test:security

      - run: npm run build
        env:
          DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/esword_ci
          NEXTAUTH_SECRET: ci-only-nextauth-secret-at-least-32-chars
          NEXTAUTH_URL: http://localhost:3000

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
